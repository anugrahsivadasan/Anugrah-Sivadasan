<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile SEO -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Title: name + role + location, this is what shows in the search result -->
    <title>Anugrah Sivadasan | Freelance Web Developer in Kerala, India</title>

    <!-- SEO Description: includes the exact phrases people search for -->
    <meta
      name="description"
      content="Anugrah Sivadasan is a freelance web developer and React frontend developer based in Kerala, building responsive websites, modern web apps, and SEO-friendly digital experiences for clients across India."
    />

    <!-- Extra keyword hints (low weight for Google now, but harmless and used by some search engines) -->
    <meta
      name="keywords"
      content="kerala web developer, freelance web developer kerala, freelance website developer kerala, react developer kerala, web designer kerala, web developer kannur, web developer ernakulam, web developer kochi, website developer kerala, frontend developer kerala"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Anugrah Sivadasan" />
    <link rel="canonical" href="https://anugrah-sivadasan.vercel.app/" />

    <!-- Google Verification -->
    <meta
      name="google-site-verification"
      content="kCLTMKLZmbideX_pdJBNA9dtbt2i4cFkzvPIytPw4nE"
    />

    <!-- Open Graph (Social Preview) -->
    <meta
      property="og:title"
      content="Anugrah Sivadasan | Freelance Web Developer in Kerala"
    />
    <meta
      property="og:description"
      content="Freelance web developer and React frontend specialist based in Kerala — portfolio showcasing projects, skills, and experience."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://anugrah-sivadasan.vercel.app/" />
    <meta
      property="og:image"
      content="https://anugrah-sivadasan.vercel.app/Anugrah.jpeg"
    />
    <meta property="og:site_name" content="Anugrah Sivadasan" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Anugrah Sivadasan | Freelance Web Developer in Kerala"
    />
    <meta
      name="twitter:description"
      content="Freelance web developer and React frontend specialist based in Kerala — portfolio showcasing projects, skills, and experience."
    />
    <meta
      name="twitter:image"
      content="https://anugrah-sivadasan.vercel.app/Anugrah.jpeg"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/Anugrah.jpeg" sizes="512x512" />

    <!--
      Structured data: Person schema.
      This is what tells Google "this is a person, this is their job,
      this is where they're based" — it directly supports ranking for
      role + location searches, not just name searches.

      TODO: replace the sameAs URLs below with your real GitHub/LinkedIn
      (and Twitter/X, Instagram, etc. if you have them). More real,
      active profiles listed here = stronger signal.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Anugrah Sivadasan",
        "alternateName": "Anugrah Sivadasan Portfolio",
        "jobTitle": "Freelance Web Developer",
        "url": "https://anugrah-sivadasan.vercel.app/",
        "image": "https://anugrah-sivadasan.vercel.app/Anugrah.jpeg",
        "knowsAbout": [
          "Web Development",
          "React",
          "JavaScript",
          "Tailwind CSS",
          "Frontend Development",
          "SEO"
        ],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Ernakulam",
          "addressRegion": "Kerala",
          "addressCountry": "IN"
        },
        "sameAs": [
          "https://github.com/YOUR-GITHUB-USERNAME",
          "https://linkedin.com/in/YOUR-LINKEDIN-USERNAME"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
